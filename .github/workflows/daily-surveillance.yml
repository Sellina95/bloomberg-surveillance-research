name: Daily Bloomberg Surveillance Research

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Broadcast date (YYYY-MM-DD)"
        required: false
        type: string
      source_url:
        description: "Verified full Bloomberg Surveillance YouTube URL"
        required: false
        type: string

  schedule:
    # Mon-Fri 07:30 KST = Sun-Thu 22:30 UTC (previous day)
    - cron: "30 22 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

# A second publisher must not commit/deploy an older snapshot over a new one.
concurrency:
  group: surveillance-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-surveillance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai ruff

      - name: Verify required secrets
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          test -n "$SUPADATA_API_KEY"
          test -n "$GEMINI_API_KEY"

          echo "SUPADATA_API_KEY=SET"
          echo "GEMINI_API_KEY=SET"

          if [ -z "${{ inputs.source_url }}" ]; then
            test -n "$SERPAPI_API_KEY"
            echo "SERPAPI_API_KEY=SET"
          else
            echo "SERPAPI_API_KEY=SKIPPED_MANUAL_OVERRIDE"
          fi

      - name: Validate chapterless program fallback
        run: |
          python -m compileall -q scripts src tests
          ruff check scripts src tests --select F821
          python tests/test_report_regeneration_contract_v0_1.py
          python tests/test_source_discovery_contract_v0_1.py
          python tests/test_chapterless_program_fallback_v0_1.py
          python tests/test_public_language_policy_v0_1.py
          python tests/test_korean_numeric_translation_contract_v0_1.py
          python tests/test_gemini_timeout_contract_v0_1.py
          python tests/test_manual_source_override_contract_v0_1.py
          python tests/test_en_ko_semantic_parity_v0_1.py
          python tests/test_verbatim_gate_v0_1.py
          python tests/test_provenance_contract_v0_1.py
          python tests/test_atomic_publication_contract_v0_1.py
          python tests/test_publication_ui_contract_v0_1.py

      - name: Validate manual override inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if { [ -n "${{ inputs.source_url }}" ] && [ -z "${{ inputs.report_date }}" ]; } ||              { [ -z "${{ inputs.source_url }}" ] && [ -n "${{ inputs.report_date }}" ]; }; then
            echo "Manual override requires BOTH report_date and source_url"
            exit 1
          fi

      - name: Prepare manual source override
        if: ${{ inputs.source_url != '' }}
        env:
          MANUAL_SOURCE_DATE: ${{ inputs.report_date }}
          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python scripts/prepare_manual_source_override_v0_1.py

      - name: Update surveillance inventory
        if: ${{ inputs.source_url == '' }}
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python scripts/update_surveillance_inventory_v0_1.py

      - name: Build, validate, and atomically publish latest surveillance
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -n "${{ inputs.source_url }}" ]; then
            export ALLOW_HISTORICAL_BACKFILL=1
          fi
          python scripts/run_atomic_publication_v0_1.py

      - name: Validate public surface
        run: |
          python scripts/validate_public_surface_v0_1.py

      - name: Verify latest TV report
        run: |
          latest_dir=$(find data/processed/surveillance \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort \
            | tail -1)

          test -n "$latest_dir"

          test -f "$latest_dir/daily_research_report_tv_v0_1.html"

          echo "LATEST REPORT:"
          echo "$latest_dir/daily_research_report_tv_v0_1.html"

      - name: Commit generated research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Public publication allowlist.
          # Never stage transcript/evidence-rich private research artifacts.
          find data/processed/surveillance -type f \( \
            -name 'daily_research_report_v0_1.json' -o \
            -name 'daily_research_report_v0_1.md' -o \
            -name 'daily_research_report_tv_v0_1.html' -o \
            -name 'daily_research_report_ko_v0_1.json' -o \
            -name 'daily_research_report_tv_ko_v0_1.html' -o \
            -name 'report_provenance_v0_1.json' -o \
            -name 'publication_status_v0_1.json' \
          \) -print0 | xargs -0 -r git add -f --

          git add -f -- data/processed/surveillance/index.html

          if git diff --cached --quiet; then
            echo "NO NEW ARTIFACTS"
          else
            git commit -m "Update daily Bloomberg Surveillance research"
            git push
          fi

      - name: Build public Research Desk site
        run: |
          python scripts/build_research_desk_pages_v0_1.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Research Desk Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Research Desk to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
